name: ci

on:
  push:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push PG 17
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64/v8
          file: Dockerfile-17
          push: true
          tags: playmentsadmin/postgres-cloudnativepg-ivm:17.10-pg_ivm1.16

      -
        name: Build and push PG 17
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64/v8
          file: Dockerfile-17-fix2
          push: true
          tags: playmentsadmin/postgres-cloudnativepg-ivm:17.10-pg_ivm1.16-perf-fix2


      -
        name: Build and push PG 18
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64/v8
          file: Dockerfile-18
          push: true
          tags: playmentsadmin/postgres-cloudnativepg-ivm:18.6-pg_ivm1.16

      -
        name: Build and push PG 18
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64/v8
          file: Dockerfile-18-fix2
          push: true
          tags: playmentsadmin/postgres-cloudnativepg-ivm:18.6-pg_ivm1.16-perf-fix2
